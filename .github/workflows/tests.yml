name: Swift tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test on iPad simulator
        run: |
          xcodebuild -project ScribbleScout.xcodeproj -scheme ScribbleScout \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.2' \
            -derivedDataPath build -resultBundlePath build/Testing.xcresult \
            -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test
      - name: Archive test report
        if: always() && hashFiles('build/Testing.xcresult/Info.plist') != ''
        run: ditto -c -k --keepParent build/Testing.xcresult build/Testing.xcresult.zip
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/Testing.xcresult.zip
          retention-days: 7
